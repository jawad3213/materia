name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy Backend to ECS Fargate"
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy Frontend to S3 + CloudFront"
        type: boolean
        default: true

permissions:
  id-token: write   # Required for AWS OIDC federation
  contents: read

env:
  AWS_REGION: eu-west-3
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD || secrets.AWS_ROLE_TO_ASSUME }}
  ECR_REPOSITORY: materia-prod-backend
  ECS_CLUSTER: materia-prod-cluster
  ECS_SERVICE: materia-prod-service
  S3_BUCKET: ${{ secrets.PROD_FRONTEND_S3_BUCKET || 'materia-prod-frontend' }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ===================================================================
  # Job 1: Build & Deploy Backend (Spring Boot -> ECR -> ECS Fargate)
  # ===================================================================
  deploy-backend:
    name: Backend (Production ECS Fargate)
    if: ${{ github.event_name == 'push' || inputs.deploy_backend == true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build Spring Boot JAR with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Authenticate with AWS via OIDC (Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            backend/
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger ECS Fargate Deployment
        run: |
          echo "Updating Production ECS service $ECS_SERVICE in cluster $ECS_CLUSTER..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: Await ECS Deployment Stability
        run: |
          echo "Waiting for Production ECS Fargate tasks to reach steady state..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

  # ===================================================================
  # Job 2: Build & Deploy Frontend (React SPA -> S3 + CloudFront CDN)
  # ===================================================================
  deploy-frontend:
    name: Frontend (Production S3 + CloudFront)
    if: ${{ github.event_name == 'push' || inputs.deploy_frontend == true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Production Bundle
        run: |
          cd frontend
          npx vite build

      - name: Authenticate with AWS via OIDC (Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Frontend Artifacts to S3
        run: |
          echo "Uploading static assets to s3://$S3_BUCKET..."
          aws s3 sync frontend/dist/ s3://$S3_BUCKET --delete

      - name: Invalidate CloudFront CDN Cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          echo "Invalidating CloudFront CDN cache for distribution $CLOUDFRONT_DISTRIBUTION_ID..."
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
