name: Deploy to Staging

on:
  push:
    branches:
      - staging
      - develop
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy Backend to ECS Fargate"
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy Frontend to S3 + CloudFront"
        type: boolean
        default: true

permissions:
  id-token: write   # Required for AWS OIDC federation
  contents: read

env:
  AWS_REGION: eu-west-3
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING || secrets.AWS_ROLE_TO_ASSUME }}
  ECR_REPOSITORY: materia-staging-backend
  ECS_CLUSTER: materia-staging-cluster
  ECS_SERVICE: materia-staging-service
  S3_BUCKET: ${{ secrets.STAGING_FRONTEND_S3_BUCKET || 'materia-staging-frontend' }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ===================================================================
  # Job 1: Build & Deploy Backend (Spring Boot -> ECR -> ECS Fargate)
  # ===================================================================
  deploy-backend:
    name: Backend (ECS Fargate)
    if: ${{ github.event_name == 'push' || inputs.deploy_backend == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build Spring Boot JAR with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Authenticate with AWS via OIDC (Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            backend/
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download Current ECS Task Definition
        run: |
          echo "Fetching active task definition for service $ECS_SERVICE..."
          TASK_DEF_ARN=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" --query taskDefinition > task-definition.json

      - name: Render New Task Definition with Pushed Image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ===================================================================
  # Job 2: Build & Deploy Frontend (React SPA -> S3 + CloudFront CDN)
  # ===================================================================
  deploy-frontend:
    name: Frontend (S3 + CloudFront)
    if: ${{ github.event_name == 'push' || inputs.deploy_frontend == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Staging Bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.STAGING_VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: |
          cd frontend
          npx vite build --mode staging

      - name: Authenticate with AWS via OIDC (Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Frontend Artifacts to S3
        run: |
          echo "Uploading static assets to s3://$S3_BUCKET..."
          aws s3 sync frontend/dist/ s3://$S3_BUCKET --delete

      - name: Invalidate CloudFront CDN Cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          echo "Invalidating CloudFront cache for distribution $CLOUDFRONT_DISTRIBUTION_ID..."
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
