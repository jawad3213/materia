# ===================================================================
server.port=8080
# Spring Boot Base Configuration (Shared across all environments)
# ===================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Common Driver & Hibernate Settings
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES}
spring.jpa.open-in-view=false
spring.flyway.default-schema=${SPRING_FLYWAY_DEFAULT_SCHEMA}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing

# ===================================================================
# Swagger / OpenAPI Properties (SpringDoc)
# ===================================================================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.info.title=${SPRINGDOC_INFO_TITLE}
springdoc.info.description=${SPRINGDOC_INFO_DESCRIPTION}
springdoc.info.version=${SPRINGDOC_INFO_VERSION}
springdoc.info.contact.name=${SPRINGDOC_INFO_CONTACT_NAME}
springdoc.info.contact.email=${SPRINGDOC_INFO_CONTACT_EMAIL}

# ===================================================================
# Messaging Strategy ('spring' for in-process events, 'kafka' for distributed broker)
# ===================================================================
app.messaging.type=${APP_MESSAGING_TYPE:spring}

# ===================================================================
# Kafka Base Configuration (Active when app.messaging.type=kafka)
# ===================================================================
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP}
# ===================================================================
# JWT Security Configuration
# ===================================================================
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# ===================================================================
# Security & CORS Configuration
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/api/v1/auth/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/api/v1/kafka/**,/actuator/**,/error,/api/v1/masterdata/**,/api/v1/masterdata/suppliers/**}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Refresh-token cookie attributes.
# Dev (http://localhost) needs Secure=false; any HTTPS deployment must set it to true.
# Keep SameSite=Strict while the SPA and the API share a site; set it to None
# (which forces Secure) when they are served from different sites.
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}

# ===================================================================
# Gateway Rate Limiting
# ===================================================================
gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_RPM:120}
# Tighter quota for /auth/login, /auth/forgot-password and /auth/reset-password
gateway.rate-limit.max-auth-requests-per-minute=${GATEWAY_RATE_LIMIT_AUTH_MAX_RPM:10}

# ===================================================================
# Actuator & Health Check Configuration (AWS ALB & ECS Fargate)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# ===================================================================
# Mail / SMTP Configuration
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:noreply@materia.com}
app.mail.reset-password-base-url=${APP_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

