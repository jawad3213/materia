# ===================================================================
server.port=8080
# Spring Boot Base Configuration (Shared across all environments)
# ===================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Common Driver & Hibernate Settings
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES}
spring.jpa.open-in-view=false
spring.flyway.default-schema=${SPRING_FLYWAY_DEFAULT_SCHEMA}
spring.flyway.baseline-on-migrate=true

# ===================================================================
# Swagger / OpenAPI Properties (SpringDoc)
# ===================================================================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.info.title=${SPRINGDOC_INFO_TITLE}
springdoc.info.description=${SPRINGDOC_INFO_DESCRIPTION}
springdoc.info.version=${SPRINGDOC_INFO_VERSION}
springdoc.info.contact.name=${SPRINGDOC_INFO_CONTACT_NAME}
springdoc.info.contact.email=${SPRINGDOC_INFO_CONTACT_EMAIL}

# ===================================================================
# Kafka Base Configuration
# ===================================================================
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP}
# ===================================================================
# JWT Security Configuration
# ===================================================================
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# ===================================================================
# Security & CORS Configuration
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ===================================================================
# ExchangeRate-API Configuration
# ===================================================================
materia.exchange-rate.base-url=${EXCHANGE_BASE_URL}
materia.exchange-rate.api-key=${EXCHANGE_API_KEY}
materia.exchange-rate.cache-ttl-minutes=${EXCHANGE_CACHE_TTL_MINUTES}
materia.exchange-rate.timeout-ms=${EXCHANGE_TIMEOUT_MS}
