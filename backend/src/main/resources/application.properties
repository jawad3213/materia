# ===================================================================
server.port=8080
# Spring Boot Base Configuration (Shared across all environments)
# ===================================================================
spring.profiles.active=dev

# Common Driver & Hibernate Settings
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true

# ===================================================================
# Swagger / OpenAPI Properties (SpringDoc)
# ===================================================================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.info.title=Materia Backend API
springdoc.info.description=RESTful API documentation for Materia Backend application
springdoc.info.version=1.0.0
springdoc.info.contact.name=Materia Team
springdoc.info.contact.email=support@materia.com

# ===================================================================
# Kafka Base Configuration
# ===================================================================
spring.kafka.consumer.group-id=materia-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.listener.auto-startup=false
# ===================================================================
# JWT Security Configuration
# ===================================================================
jwt.access-secret=${JWT_ACCESS_SECRET:${JWT_SECRET:bWF0ZXJpYS1hY2Nlc3MtdG9rZW4tc2VjcmV0LWtleS0yMDI2LXN1cGVyLXNlY3JldC1rZXktZm9yLWFjY2Vzcw==}}
jwt.refresh-secret=${JWT_REFRESH_SECRET:bWF0ZXJpYS1yZWZyZXNoLXRva2VuLXNlY3VyaXR5LWtleS0yMDI2LXN1cGVyLXNlY3JldC1rZXktZm9yLXJlZnJlc2g=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================================
# Security & CORS Configuration
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/api/v1/auth/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/api/v1/kafka/**,/actuator/**,/error,/api/v1/masterdata/**,/api/v1/masterdata/suppliers/**}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
