spring.application.name=backend2

# TLS is terminated at the load balancer, so trust X-Forwarded-* for
# request.isSecure() and generated URLs.
server.forward-headers-strategy=framework

# Session cookie must be Secure over HTTPS.
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
