# ===================================================================
# Development Environment Configuration (application-dev.properties)
# ===================================================================

# Database Connection (Reads from .env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate Development Settings
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL}
spring.jpa.generate-ddl=${SPRING_JPA_GENERATE_DDL}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO}

# Swagger / OpenAPI Development Overrides
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Kafka Development Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

# Development Public Endpoints
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS}
