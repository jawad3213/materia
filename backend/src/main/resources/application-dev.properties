# ===================================================================
# Development Environment Configuration (application-dev.properties)
# ===================================================================

# Database Connection (Reads secrets from .env with fallback defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/materia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

# JPA / Hibernate Development Settings (Fixed code behavior, no need in .env)
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update

# Swagger / OpenAPI Development Overrides
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Kafka Development Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Development Public Endpoints (Permit development workflows and seeder)
app.security.public-endpoints=/api/v1/auth/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/api/v1/kafka/**,/actuator/**,/error,/api/v1/masterdata/**,/api/v1/purchase-requisitions/**,/api/v1/purchase-orders/**,/api/v1/goods-receipts/**,/api/v1/invoices/**,/api/v1/payments/**,/api/v1/return-to-vendors/**,/api/v1/currencies/**

